[package]
name = "kubernix-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
capnp.workspace = true
capnp-rpc = "0.27.0"
color-eyre.workspace = true
ed25519-dalek.workspace = true
eyre.workspace = true
futures-util.workspace = true
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
kubernix-signing.workspace = true
kubernix-types.workspace = true
rand = "0.10"
russh = { version = "0.62.5", features = ["async-trait"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2.workspace = true
sqlx = { version = "0.9.0", features = ["migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zstd.workspace = true

[build-dependencies]
capnpc = "0.27"

[dev-dependencies]
serial_test = "4.0.1"
