{{- if and .Values.cnpg.enabled .Values.postgres.cluster.enabled }}
# `server/migrations/20260814120000_row_level_security.sql` creates
# `kubernix_app`/`kubernix_gc` with LOGIN but no password — fine under the
# trust auth dev/test setups use, unusable against this chart's CNPG cluster
# (scram auth). That's a deployment/provisioning concern, not application
# logic, so it's fixed entirely here rather than in `server/`: stamp both
# roles with the same password already authenticating the superuser
# connection every app container uses, right after at least one of those
# containers has had a chance to run migrations and create the roles.
#
# Idempotent (`IF EXISTS` guards, not `CREATE ROLE`  — role creation stays
# the migration's job) and safe to run before the roles exist yet: both
# branches simply no-op, and the retry loop below covers the ordering race
# with the app Deployments' first startup rather than this Job's own
# `backoffLimit` alone.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-db-role-passwords" (include "kubernix.fullname" .) }}
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "kubernix.selectorLabels" (dict "context" $ "component" "db-role-passwords") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: alter-role-passwords
          image: postgres:17-alpine
          env:
            {{- include "kubernix.databaseUrlEnv" . | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Escape single quotes the way an ALTER ROLE literal needs
              # (doubling them), the same substance PostgresStore::connect
              # would need in Rust if this lived there instead.
              escaped=$(printf '%s' "$PGSUPERPASSWORD" | sed "s/'/''/g")
              for i in $(seq 1 30); do
                if PGPASSWORD="$PGSUPERPASSWORD" psql -h "$PGSUPERHOST" -U "$PGSUPERUSER" -d kubernix -v ON_ERROR_STOP=1 -c "
                  DO \$\$ BEGIN
                    IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'kubernix_app') THEN
                      ALTER ROLE kubernix_app PASSWORD '${escaped}';
                    END IF;
                    IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'kubernix_gc') THEN
                      ALTER ROLE kubernix_gc PASSWORD '${escaped}';
                    END IF;
                  END \$\$;
                "; then
                  echo "kubernix_app/kubernix_gc passwords stamped (or not yet created — no-op)"
                  exit 0
                fi
                echo "waiting for the cluster to accept connections (attempt $i/30)..."
                sleep 10
              done
              echo "giving up after 30 attempts" >&2
              exit 1
{{- end }}
