[workspace]
resolver = "3"
members = ["crates/*"]

metadata.crane.name = "kubernix"
package.version = "0.1.0"

[workspace.dependencies]
kubernix-daemon-protocol = { version = "0.1.0", path = "./crates/daemon-protocol" }
kubernix-guest-protocol = { version = "0.1.0", path = "./crates/guest-protocol" }
kubernix-signing = { version = "0.1.0", path = "./crates/signing" }
kubernix-types = { version = "0.1.0", path = "./crates/types" }
workspace-hack = { version = "0.1.0", path = "./crates/workspace-hack" }

async-compression = { version = "0.4", features = ["tokio", "zstd", "xz", "bzip2", "gzip", "brotli", "lz4"] }
async-nats = "0.50.0"
async-trait = "0.1.92"
aws-config = "1.10.1"
aws-sdk-s3 = "1.140"
bytes = "1"
capnp = { version = "0.27", features = ["alloc", "std"] }
color-eyre = "0.6.5"
digest-io-async = "0.1"
ed25519-dalek = { version = "3", features = ["digest", "rand_core"] }
eyre = "0.6.14"
futures-util = "0.3.33"
postcard = "1"
postcard-rpc = "0.12"
postcard-schema = "0.2"
rand = "0.10"
serde = "1"
sha2 = "0.11"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
zstd = "0.13.3"
