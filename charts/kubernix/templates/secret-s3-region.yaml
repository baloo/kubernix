# Barman Cloud's ObjectStore CRD only accepts s3Credentials.region as a
# secretKeyRef (see postgres-objectstore.yaml) — there's no plain-string
# field for it. Always create our own tiny Secret for that key rather than
# assuming a user-supplied s3.existingSecret happens to carry a "region"
# key, so s3.region stays a single template parameter regardless of which
# credentials source is in play.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-s3-region" (include "kubernix.fullname" .) }}
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
type: Opaque
stringData:
  region: {{ .Values.s3.region | quote }}
