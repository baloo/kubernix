# Barman Cloud's ObjectStore CRD only accepts s3Credentials.region as a
# secretKeyRef (see postgres-objectstore.yaml) — there's no plain-string
# field for it. Only created when postgres.backup.s3.region is explicitly
# set; otherwise the ObjectStore references the shared <fullname>-s3-region
# Secret instead (see kubernix.postgresBackupS3).
{{- $backupS3 := include "kubernix.postgresBackupS3" . | fromJson -}}
{{- if $backupS3.createOwnRegionSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $backupS3.regionSecretName }}
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
type: Opaque
stringData:
  region: {{ .Values.postgres.backup.s3.region | quote }}
{{- end }}
