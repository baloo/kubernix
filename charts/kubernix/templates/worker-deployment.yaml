apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-worker" (include "kubernix.fullname" .) }}
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "kubernix.selectorLabels" (dict "context" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubernix.selectorLabels" (dict "context" $ "component" "worker") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      {{- include "kubernix.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          # No DB/S3 credentials, by design — the worker only ever talks to
          # NATS and to pre-signed S3 URLs it's handed over NATS.
          #
          # KUBERNIX_VM_KERNEL/KUBERNIX_VM_INITRD are baked into
          # image.worker itself (nix/images.nix) — per-tenant VM isolation
          # is the only mode this worker runs in, not a deployment-time
          # opt-in. Only the VM's own sizing is a chart concern.
          env:
            - name: NATS_URL
              value: {{ printf "nats://%s-nats:4222" .Release.Name | quote }}
            - name: NIX_SYSTEM
              value: {{ .Values.worker.system | quote }}
            - name: KUBERNIX_VM_VCPUS
              value: {{ .Values.worker.vm.vcpus | quote }}
            - name: KUBERNIX_VM_MEMORY_MB
              value: {{ .Values.worker.vm.memoryMb | quote }}
            - name: KUBERNIX_VM_STORE_IMG_MB
              value: {{ .Values.worker.vm.storeImgMb | quote }}
            - name: RUST_LOG
              value: debug
          # $HOME and KUBERNIX_NIX_STORE both point under here — baked into
          # the image itself (nix/images.nix), not set here, since they're a
          # property of how this image runs a worker at all, not something
          # deployment-specific.
          volumeMounts:
            - name: state
              mountPath: /var/lib/kubernix-worker
          resources:
            # `devices.kubevirt.io/kvm`-style extended resource, merged with
            # (and overridable by) worker.resources — this is what actually
            # grants /dev/kvm to the container via whatever device-plugin
            # DaemonSet on the cluster registers it, with no `privileged:
            # true` and no node-specific `kvm` group GID to guess at. Bump
            # worker.resources' own requests/limits to cover each tenant
            # VM's memoryMb/vcpus on top of the worker process's own
            # footprint — nothing here does that arithmetic automatically.
            {{- $vmResources := dict "limits" (dict .Values.worker.vm.kvmResourceName "1") }}
            {{- toYaml (mergeOverwrite $vmResources .Values.worker.resources) | nindent 12 }}
      volumes:
        # Ephemeral by design — Phase 15's own storage decisions treat a
        # worker's local store as a disposable cache, never the source of
        # truth (S3 holds verified outputs), so a pod restart losing it is a
        # cold-cache cost, not a correctness problem.
        - name: state
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
