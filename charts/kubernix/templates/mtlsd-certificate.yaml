{{- if .Values.mtlsd.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-mtlsd" (include "kubernix.fullname" .) }}
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
spec:
  secretName: {{ printf "%s-mtlsd-tls" (include "kubernix.fullname" .) }}
  dnsNames:
    {{- required "mtlsd.certManager.dnsNames is required" .Values.mtlsd.certManager.dnsNames | toYaml | nindent 4 }}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: {{ required "mtlsd.certManager.issuerRef.name is required" .Values.mtlsd.certManager.issuerRef.name }}
    kind: {{ .Values.mtlsd.certManager.issuerRef.kind }}
    group: {{ .Values.mtlsd.certManager.issuerRef.group }}
{{- end }}
