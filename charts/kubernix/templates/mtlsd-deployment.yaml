{{- if .Values.mtlsd.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-mtlsd" (include "kubernix.fullname" .) }}
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
spec:
  # Stateless: the server certificate is a shared Secret and sessions live and
  # die with their connection, so replicas scale freely.
  replicas: {{ .Values.mtlsd.replicas }}
  selector:
    matchLabels:
      {{- include "kubernix.selectorLabels" (dict "context" $ "component" "mtlsd") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubernix.selectorLabels" (dict "context" $ "component" "mtlsd") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- include "kubernix.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mtlsd
          image: "{{ .Values.image.server.repository }}:{{ .Values.image.server.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          command: ["/bin/kubernix-mtlsd"]
          ports:
            - name: mtls
              containerPort: 2224
          env:
            {{- include "kubernix.databaseUrlEnv" . | nindent 12 }}
            {{- include "kubernix.s3Env" . | nindent 12 }}
            - name: NATS_URL
              value: {{ printf "nats://%s-nats:4222" .Release.Name | quote }}
            # PLAN.md Phase 19 -- must match the worker's and kubernix-gc's
            # own copies of this same value (see values.yaml's own comment).
            - name: KUBERNIX_JOB_RESULTS_RETENTION
              value: {{ .Values.jobs.resultsRetention | quote }}
            - name: KUBERNIX_TLS_LISTEN
              value: {{ .Values.mtlsd.listen | quote }}
            - name: KUBERNIX_TLS_CERT
              value: /etc/kubernix/tls/tls.crt
            - name: KUBERNIX_TLS_KEY
              value: /etc/kubernix/tls/tls.key
            {{- with .Values.substituters.defaultUrl }}
            - name: KUBERNIX_DEFAULT_SUBSTITUTER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.substituters.defaultPublicKey }}
            - name: KUBERNIX_DEFAULT_SUBSTITUTER_KEY
              value: {{ . | quote }}
            {{- end }}
            - name: KUBERNIX_SUBSTITUTER_NEGATIVE_CACHE_TTL
              value: {{ .Values.substituters.negativeCacheTtl | quote }}
            {{- with .Values.substituters.httpHost }}
            - name: KUBERNIX_HTTP_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: RUST_LOG
              value: debug
            {{- with .Values.tls.extraCaVolumeMounts }}
            {{- include "kubernix.extraCaEnv" $ | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: server-tls
              mountPath: /etc/kubernix/tls
              readOnly: true
            {{- with .Values.tls.extraCaVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.mtlsd.resources | nindent 12 }}
      volumes:
        - name: server-tls
          secret:
            secretName: {{ printf "%s-mtlsd-tls" (include "kubernix.fullname" .) }}
            defaultMode: 0440
        {{- with .Values.tls.extraCaVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mtlsd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mtlsd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mtlsd.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
