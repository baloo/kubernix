{{- if and .Values.cnpg.enabled .Values.postgres.cluster.enabled }}
{{- $backupS3 := include "kubernix.postgresBackupS3" . | fromJson }}
# Continuous WAL archiving + base backups, via the Barman Cloud CNPG-I
# plugin (see Chart.yaml's plugin-barman-cloud dependency). Independently
# configurable via postgres.backup.s3 (see values.yaml) — by default (that
# block left empty) this falls back to the same S3-compatible store every
# other Kubernix service writes NARs/logs to, under its own prefix
# (values.postgres.backup.path), but can be pointed at a wholly separate
# bucket/endpoint/credentials instead.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "kubernix.postgresCluster" . }}-backup
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ printf "s3://%s/%s" $backupS3.bucket .Values.postgres.backup.path | quote }}
    endpointURL: {{ $backupS3.endpoint | quote }}
    s3Credentials:
      accessKeyId:
        name: {{ $backupS3.secretName }}
        key: accessKeyId
      secretAccessKey:
        name: {{ $backupS3.secretName }}
        key: secretAccessKey
      region:
        name: {{ $backupS3.regionSecretName }}
        key: region
{{- end }}
