[package]
name = "kubernix-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats = "0.50.0"
aws-config = "1.10.1"
aws-sdk-s3 = "1.140.0"
axum = { version = "0.8.9", features = ["macros"] }
capnp = "0.27"
capnp-rpc = "0.27.0"
futures-util = "0.3.33"
rand = "0.10"
russh = { version = "0.62.5", features = ["async-trait"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[build-dependencies]
capnpc = "0.27"
