[package]
name = "kubernix-guest-agent"
version = "0.1.0"
edition = "2024"

# Deliberately minimal: this binary runs as PID 1 inside a stripped-down
# initrd (Phase 15), not alongside the frontend/worker's S3/Postgres/SSH
# stack. It needs only enough to accept a vsock connection and exec
# `nix-daemon --stdio` on the other end of it.
[dependencies]
# PLAN.md Phase 18: loads/attaches the kernel-side programs built by the
# separate `guest-agent-ebpf` crate (see its own Cargo.toml header comment
# for why it's a whole separate Cargo workspace, built with a different,
# nightly toolchain) -- this is the plain stable-toolchain userspace loader
# half, no different from any other dependency of this crate.
aya = "0.14"
color-eyre.workspace = true
eyre.workspace = true
tokio.workspace = true
tokio-vsock = "0.7.2"
tracing.workspace = true
tracing-subscriber.workspace = true
