apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-sshd" (include "kubernix.fullname" .) }}
  labels:
    {{- include "kubernix.labels" . | nindent 4 }}
  {{- with .Values.sshd.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # TCP passthrough only — SSH/daemon-protocol has no HTTP semantics for an
  # Ingress controller to route on, hence LoadBalancer/NodePort rather than
  # cache's Ingress option below.
  type: {{ .Values.sshd.service.type }}
  selector:
    {{- include "kubernix.selectorLabels" (dict "context" $ "component" "sshd") | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.sshd.service.port }}
      targetPort: ssh
