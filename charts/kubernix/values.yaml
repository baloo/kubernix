# Defaults here follow nix/module.nix, the NixOS module that is the source of
# truth for every env var/flag each binary takes.

# Names of existing `kubernetes.io/dockerconfigjson` Secrets in this release's
# namespace, e.g. [{name: registry-creds}] — needed whenever image.*.repository
# points at a private registry requiring auth to pull, not just to push.
imagePullSecrets: []

image:
  # kubernix-sshd, kubernix-server (cache), kubernix-gc and
  # kubernix-rotate-capability-secret all ship from this one image
  # (nix/images.nix: kubernix-server-image) — only the container `command:`
  # differs between their Deployments.
  #
  # `pullPolicy: Always` is load-bearing with a mutable `tag: latest`, not
  # cosmetic: `IfNotPresent` means a node that already has *any* image cached
  # under that name:tag never even asks the registry whether it changed, so
  # `just image-push`/`helm upgrade`/`kubectl rollout restart` silently keep
  # running the old code — found by chasing a deployed fix that measurably
  # wasn't taking effect. Pin an immutable tag (a content hash, a git sha) and
  # switch back to `IfNotPresent` if avoiding the extra pull latency ever
  # matters more than this footgun.
  server:
    repository: kubernix-server
    tag: latest
    pullPolicy: Always
  worker:
    repository: kubernix-worker
    tag: latest
    pullPolicy: Always

# The object store every service reads/writes NARs, logs and (via the CNPG
# backup plugin below, under a distinct prefix) database backups to. Stays
# external — no MinIO subchart — matching nix/module.nix's `s3Options`.
s3:
  endpoint: http://minio:9000
  bucket: kubernix
  region: us-east-1
  # Set to use an existing Secret instead of the accessKeyId/secretAccessKey
  # below (dev-only default, same as nix/module.nix's). Expected keys:
  # accessKeyId, secretAccessKey.
  existingSecret: ""
  accessKeyId: minioadmin
  secretAccessKey: minioadmin

postgres:
  cluster:
    # Gates the Cluster/ObjectStore/ScheduledBackup CRs themselves,
    # independently of cnpg.enabled (which gates the operator/plugin/
    # cert-manager subchart dependencies). Needed because Helm validates
    # every object in a release against the API server's known types before
    # applying any of them — a CRD and a custom resource of that CRD's kind
    # can't land in the same `helm install`. Bring the operators up first
    # with this set to `false`, then `helm upgrade --set
    # postgres.cluster.enabled=true` once their CRDs are registered.
    enabled: true
  # Streaming replication instance count: 1 primary + (instances - 1)
  # standbys. 2 is the minimum that gives you a standby at all.
  instances: 2
  storage:
    size: 10Gi
    storageClass: ""
  backup:
    # CNPG ScheduledBackup cron (note: seconds-first, like
    # github.com/robfig/cron, not a plain 5-field k8s CronJob schedule).
    schedule: "0 0 2 * * *"
    # Prefix under s3.bucket that WAL/base backups are written to.
    path: pgbackups
    retentionPolicy: "30d"

nats:
  enabled: true
  # Forced on regardless of what the subchart's own values.yaml defaults to —
  # kubernix-worker/-sshd refuse to queue/dequeue jobs without it. Nested
  # under `config`, not top-level `jetstream` — that's this subchart's own
  # structure (`charts/nats/values.yaml`), easy to get wrong since NATS'
  # upstream docs/CLI talk about "jetstream" as if it were top-level.
  config:
    jetstream:
      enabled: true
  # The NATS process already exposes its monitoring HTTP API
  # (config.monitor, port 8222) by default, but the subchart's own Service
  # doesn't forward it unless asked — needed so KEDA's nats-jetstream scaler
  # (worker.autoscaling) can query queue depth from outside the pod.
  service:
    ports:
      monitor:
        enabled: true

# Own condition, not folded into cnpg.enabled — see Chart.yaml's comment on
# the cert-manager dependency for why installing this one stage earlier
# matters.
certManager:
  enabled: true

cnpg:
  enabled: true

# The KEDA operator (cluster-scoped CRDs + controller), bundled the same way
# cert-manager/cnpg are — see the README's note on bundled-vs-cluster-shared
# operators before disabling this on a cluster that already runs one.
keda:
  enabled: true

# Values passed through to the cert-manager subchart itself. It doesn't
# install its own CRDs by default; plugin-barman-cloud's Issuer/Certificate
# can't be created without them.
cert-manager:
  crds:
    enabled: true

sshd:
  replicas: 1
  listen: "0.0.0.0:2222"
  # Which SSH keys resolve to a tenant is controlled entirely by the
  # `tenant_auth_bindings` table (server/migrations/), provisioned by hand —
  # there is no per-deployment auth setting here any more.
  service:
    type: LoadBalancer
    port: 22
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

cache:
  replicas: 2
  listen: "0.0.0.0:3000"
  cachePriority: 50
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: cache.kubernix.example
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

gc:
  interval: 300
  batchSize: 10000
  cutoffs:
    verified: 2592000 # 30d
    built: 2592000 # 30d
    quarantined: 86400 # 1d
  jobRetention:
    logAfter: 604800 # 7d
    rowAfter: 7776000 # 90d
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

rotate:
  interval: 21600 # 6h
  retention: 86400 # 24h
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicas: 1
  system: x86_64-linux
  # Per-tenant `cloud-hypervisor` VM isolation (PLAN.md Phase 15) is the only
  # mode this chart runs the worker in — kernel+initrd ship baked into
  # image.worker itself (nix/images.nix), so there's nothing to point at
  # here, only how big each tenant's VM gets. `kvmResourceName` is the
  # `devices.kubevirt.io/kvm`-style extended resource a device-plugin
  # DaemonSet on the cluster registers as allocatable — requesting it is
  # what actually grants /dev/kvm access to the container, with no
  # `privileged: true` and no node-specific `kvm` group GID to guess at:
  # `/dev/kvm` is 0666 on these nodes (no udev rule narrowing it to a
  # group), so plain DAC already permits any uid to open it once the
  # extended resource above has granted the device to the pod's cgroup.
  vm:
    vcpus: 1
    # PLAN.md Phase 18: an explicit override, if set -- wins outright over
    # the chart-computed value below. Leave unset (the default) to have
    # KUBERNIX_VM_MEMORY_MB derived from worker.resources.limits.memory
    # minus overheadMb, so the VM gets ~all of the pod's own memory budget
    # without an operator having to keep two settings in sync by hand. Falls
    # back to the old fixed 768 if neither this nor
    # worker.resources.limits.memory is set (today's default).
    # memoryMb: 512
    # Fixed overhead subtracted from worker.resources.limits.memory when
    # memoryMb is unset -- covers the worker process itself plus
    # cloud-hypervisor's/passt's own host-side footprint beyond what they
    # hand the guest.
    overheadMb: 256
    storeImgMb: 8192
    kvmResourceName: devices.kubevirt.io/kvm
  # Static capability classes this worker pool declares (PLAN.md Phase 17),
  # analogous to a Nix `machines` file's supportedFeatures column — routes
  # `requiredSystemFeatures = "big-parallel"` jobs to workers deployed with
  # `big-parallel` listed here. "kvm" is NOT settable here: kvm-class
  # routing is gated by each worker's own boot-time nested-virt self-test
  # (worker/src/vm.rs::boot_probe), never by static declaration alone —
  # /dev/kvm's presence (what kvmResourceName above grants access to) does
  # not by itself prove nested virt actually works on that node.
  #
  # example: systemFeatures: ["big-parallel"]
  systemFeatures: []
  # KEDA scaling (PLAN.md Phase 13 / Phase 15 Step 7) on kubernix_jobs'
  # per-system durable consumer (worker/src/main.rs, `worker-<system>` with
  # dashes replaced by underscores — must track that naming exactly). Left
  # disabled by default: enabling it needs the `keda` dependency's CRDs
  # already registered on the cluster first (see the README's Quickstart) —
  # a `helm install`/`helm upgrade` with this at its default `false`, then a
  # second `helm upgrade --set worker.autoscaling.enabled=true`.
  #
  # minReplicaCount: 0 relies on the consumer being *durable* — its pending-
  # message count stays queryable via NATS' monitoring API even with no
  # worker pod running, which is what makes scaling back up from zero
  # possible at all.
  autoscaling:
    enabled: false
    minReplicaCount: 0
    maxReplicaCount: 10
    # KEDA scaler metadata is string-typed, hence the quotes. lagThreshold
    # targets ~5 pending jobs per active replica; activationLagThreshold is
    # KEDA's separate 0→1 threshold (lagThreshold alone only governs scaling
    # among already-active replicas). KEDA's nats-jetstream scaler activates
    # on lag > activationLagThreshold (strictly greater than, not >=) — found
    # live: "1" here meant a single queued job never activated the scaler at
    # all, since num_pending == 1 is not > 1. "0" activates on any pending
    # message, which is what a single one-off build needs.
    lagThreshold: "5"
    activationLagThreshold: "0"
    pollingInterval: 15
    cooldownPeriod: 300
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
